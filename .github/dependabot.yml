
version: 2
registries:
  piwheels:
    type: python-index
    url: https://www.piwheels.org/simple
updates:
  - package-ecosystem: "pip"
    directory: "/"
    registries:
      - piwheels
    # A registries entry disables external code execution. Pip then refuses
    # to parse manifests (unexpected_external_code).
    # https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference#insecure-external-code-execution
    insecure-external-code-execution: allow
    schedule:
      interval: "weekly"
    allow:
      - dependency-name: "gpiod"
      - dependency-name: "luma.oled"
      - dependency-name: "luma.lcd"
      - dependency-name: "textfsm"
      - dependency-name: "tzupdate"
      - dependency-name: "Pillow"
      - dependency-name: "qrcode"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
