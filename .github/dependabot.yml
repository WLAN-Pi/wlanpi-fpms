
version: 2
registries:
  piwheels:
    type: python-index
    url: https://www.piwheels.org/simple
updates:
  - package-ecosystem: "pip"
    directory: "/"
    registries:
      - piwheels
    schedule:
      interval: "weekly"
    allow:
      - dependency-name: "gpiod"
      - dependency-name: "luma.oled"
      - dependency-name: "luma.lcd"
      - dependency-name: "textfsm"
      - dependency-name: "tzupdate"
      - dependency-name: "Pillow"
      - dependency-name: "qrcode"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
