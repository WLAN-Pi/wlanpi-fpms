name: Run Python Lint Police

on:
  # Allow manual runs of workflow from Actions tab
  workflow_dispatch:

  push:
    paths-ignore: # ignore files that don't change build output
      - '**.md'
      - .github/dependabot.yml
      - .gitignore
      - LICENSE
  pull_request:
    paths-ignore: # ignore files that don't change build output
      - '**/*.md'
      - .github/dependabot.yml
      - .gitignore
      - LICENSE

permissions:
  contents: read
  actions: read

jobs:
  python-lint-police:
    name: Python Lint Police
    runs-on: "${{ vars.RUNS_ON || 'ubuntu-26.04' }}"

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Set up Python 3.13
      uses: actions/setup-python@v6
      with:
        python-version: "3.13"

    - name: Install tox
      run: |
        python -m ensurepip --upgrade
        python -m pip install --upgrade "tox>=4"

    - name: Run linter
      id: linter
      run: |
        tox -e lint

  slack-workflow-status:
    if: ${{ always() && (github.repository_owner == 'WLAN-Pi') && (! github.event.pull_request.head.repo.fork) }}
    name: Post Workflow Status to Slack
    needs:
      - python-lint-police
    runs-on: 'ubuntu-26.04'
    steps:
      - name: Slack Workflow Notification
        uses: Gamesight/slack-workflow-status@master
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          slack_webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
