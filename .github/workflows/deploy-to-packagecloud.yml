name: Deploy to Packagecloud

on:
  # Allow manual runs of workflow from Actions tab
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - 'debian/changelog'

permissions:
  contents: read
  actions: read

jobs:
  check_version:
    name: Check py & deb pkg versions match
    uses: WLAN-Pi/gh-workflows/.github/workflows/check-py-deb-pkg-versions-match.yml@main
    with:
      python_version_file_path: 'fpms/__version__.py'

  sbuild:
    name: sbuild trixie+arm64

    needs: check_version

    runs-on: 'ubuntu-24.04-arm'

    environment: PACKAGECLOUD
    
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: sbuild for trixie arm64
        uses: wlan-pi/sbuild-debian-package@main
        id: build-debian-package
        with:
          distro: trixie
          arch: arm64
      
      - name: Archive artifacts and upload to GitHub
        uses: actions/upload-artifact@v7
        with:
          name: wlanpi-fpms-trixie-arm64
          path: ${{ steps.build-debian-package.outputs.deb-package }}

      # Push with the package_cloud CLI directly instead of an action so upload
      # errors are detected: the CLI exits 0 even when a push fails (Thor bug),
      # which has produced green runs that uploaded nothing.
      - name: Upload arm64 package to debian/trixie
        env:
          PACKAGECLOUD_TOKEN: ${{ secrets.PACKAGECLOUD_TOKEN }}
          DEB_PACKAGE: ${{ steps.build-debian-package.outputs.deb-package }}
        run: |
          if [ -z "${DEB_PACKAGE}" ]; then
            echo "::error::sbuild produced no .deb package"
            exit 1
          fi
          target="wlanpi/dev/debian/trixie"
          sudo gem install package_cloud
          echo "Pushing ${DEB_PACKAGE} to ${target}"
          out=$(package_cloud push "${target}" "${DEB_PACKAGE}" 2>&1) || true
          echo "${out}"
          echo "${out}" | grep -q "Pushing .*success!"

  slack-workflow-status:
    if: ${{ always() && (github.repository_owner == 'WLAN-Pi') && (! github.event.pull_request.head.repo.fork) }}
    name: Post Workflow Status to Slack
    needs:
      - sbuild
    runs-on: 'ubuntu-24.04-arm'
    steps:
      - name: Slack Workflow Notification
        uses: Gamesight/slack-workflow-status@2e709ce51fd47f02b7221db8547e6e6f49f81f1d # v2.0.0
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          slack_webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
