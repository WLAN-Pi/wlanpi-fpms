[tox]
skip_missing_interpreters = true
envlist = py313
requires = setuptools >= 65.5.0
           pip >= 22.3
           virtualenv >= 20.16.6

[testenv]
description = run the test driver
# skip_install: installing the package pulls the Pi-only hardware deps
# (rpi-gpio, spidev, luma, dbus-python), which do not build on CI runners.
skip_install = true
deps =
    pytest
commands =
    pytest {posargs}

[testenv:lint]
description = run the linter
# Installs nothing on purpose: mypy.ini sets ignore_missing_imports so the
# Pi-only runtime deps are not required to type check.
basepython = python3
skip_install = true
deps =
    ruff
    mypy>=1.14.1
commands =
    ruff check fpms tests
    mypy fpms

[testenv:formatcheck]
description = run the format check toolchain
basepython = python3
skip_install = true
deps =
    ruff
commands =
    ruff format --check fpms tests

[testenv:format]
description = run the format toolchain
basepython = python3
skip_install = true
deps =
    ruff
commands =
    ruff format fpms tests
