[mypy]
python_version = 3.13
follow_imports = silent
warn_redundant_casts = True
warn_unused_ignores = True
check_untyped_defs = True

# fpms imports hardware/OS libraries (luma, RPi.GPIO, gpiod, textfsm, dbus,
# spidev, ...) that are only installable on the Pi. CI runs mypy without them,
# so missing imports resolve to Any instead of failing the run.
#
# disallow_untyped_defs / disallow_any_generics are intentionally NOT enabled
# yet: the codebase is untyped. They are the ratchet target once annotations
# land (see tox.ini [testenv:lint]).
ignore_missing_imports = True
